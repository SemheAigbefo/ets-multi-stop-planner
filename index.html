<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ETS Route Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef2f5;
            color: #202124;
        }
        /* ================================
           PAGE
        ================================= */
        .page {
            width: min(700px, 92%);
            margin: 55px auto;
        }
        /* ================================
           HEADER
        ================================= */
        .header {
            margin-bottom: 25px;
        }
        .header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            color: #202124;
        }
        .header p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }
        /* ================================
           FORM
        ================================= */
        .route-form {
            background: white;
            padding: 28px;
            border-radius: 16px;
            border-top: 5px solid #005eb8;
            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.08);
        }


        /* ================================
           STOP CARD
        ================================= */

        .stop-card {
            position: relative;

            padding: 18px;

            margin-bottom: 16px;

            border: 1px solid #d9e0e6;

            border-radius: 12px;

            background: #fafcfd;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }


        .stop-card:hover {

            border-color: #b7c9d8;
        }


        /* ================================
           STOP NUMBER
        ================================= */

        .stop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
}
        .remove-stop {
            width: 30px;
            height: 30px;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50%;

            background: #eef2f5;
            color: #6b7280;

            font-size: 20px;
            font-weight: 400;

            cursor: pointer;
}
        .remove-stop:hover {
            background: #fce8e8;
            color: #c62828;
}


        .stop-number {

            display: inline-flex;

            align-items: center;

            padding: 5px 10px;

            border-radius: 20px;

            background: #005eb8;

            color: white;

            font-size: 13px;

            font-weight: 700;
        }


        /* ================================
           LABELS
        ================================= */

        .stop-label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #4b5563;
        }


        /* ================================
           SEARCH INPUT
        ================================= */

        .input-group {

            position: relative;
        }


        .stop-input {

            width: 100%;

            height: 45px;

            padding: 0 13px;

            border: 1px solid #c8d1d9;

            border-radius: 8px;

            background: white;

            color: #202124;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }


        .stop-input:focus {

            border-color: #005eb8;

            box-shadow:
                0 0 0 3px
                rgba(0, 94, 184, 0.12);
        }


        /* ================================
           SUGGESTIONS
        ================================= */

        .suggestions {

            position: absolute;

            top: calc(100% + 4px);

            left: 0;

            right: 0;

            background: white;

            border: 1px solid #cbd5df;

            border-radius: 8px;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.12);

            overflow: hidden;

            z-index: 1000;
        }


        .suggestion {

            padding: 12px 14px;

            cursor: pointer;

            font-size: 14px;

            border-bottom:
                1px solid #edf0f2;

            transition:
                background 0.12s;
        }


        .suggestion:last-child {

            border-bottom: none;
        }


        .suggestion:hover {

            background: #eaf4fb;
        }


        /* ================================
           TIME SECTION
        ================================= */

        .time-section {

            margin-top: 15px;
        }


        .time-label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #4b5563;
        }


        .time-input {

            width: 100%;

            height: 45px;

            padding: 0 12px;

            border: 1px solid #c8d1d9;

            border-radius: 8px;

            background: white;

            color: #202124;

            font-size: 16px;

            outline: none;

            cursor: pointer;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }


        .time-input:focus {

            border-color: #005eb8;

            box-shadow:
                0 0 0 3px
                rgba(0, 94, 184, 0.12);
        }


        .time-hint {

            margin-top: 6px;

            font-size: 12px;

            color: #6b7280;
        }


        /* ================================
           BUTTONS
        ================================= */

        .button-row {

            display: flex;

            gap: 10px;

            margin-top: 24px;
        }


        button,
        input[type="submit"] {

            height: 45px;

            border: none;

            border-radius: 8px;

            padding: 0 18px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.15s,
                transform 0.1s,
                opacity 0.15s;
        }


        /* ADD STOP */

        .add-stop {

            background: #e8b923;

            color: #202124;
        }


        .add-stop:hover {

            background: #dcae18;
        }


        /* SEARCH ROUTES */

        .submit-button {

            flex: 1;

            background: #005eb8;

            color: white;
        }


        .submit-button:hover {

            background: #004d96;
        }


        button:active,
        input[type="submit"]:active {

            transform: scale(0.98);
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 550px) {

            .page {

                width: 94%;

                margin: 30px auto;
            }


            .route-form {

                padding: 18px;
            }


            .header h1 {

                font-size: 26px;
            }


            .button-row {

                flex-direction: column;
            }


            .add-stop,
            .submit-button {

                width: 100%;
            }

        }

        [hidden] { display: none !important; }
        .results-screen { display: grid; gap: 16px; }
        .results-top { display: flex; align-items: center; gap: 14px; }
        .back-button { border: 0; background: #fff; color: #005eb8;
            padding: 10px 14px; border-radius: 9px; font-weight: 700;
            cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        .journey-summary { color: white; background: #005eb8;
            border-radius: 16px; padding: 22px; }
        .journey-summary h2 { margin: 0 0 8px; font-size: 24px; }
        .journey-summary p { margin: 4px 0; color: #e8f3ff; }
        .leg-result { border: 1px solid #d9e0e6; border-left: 5px solid var(--leg-color, #005eb8); border-radius: 14px;
            background: white; overflow: hidden; }
        .leg-result summary { cursor: pointer; list-style: none; padding: 18px;
            display: grid; grid-template-columns: 42px 1fr auto; gap: 12px;
            align-items: center; }
        .leg-result summary::-webkit-details-marker { display: none; }
        .leg-number { width: 36px; height: 36px; display: grid;
            place-items: center; border-radius: 50%; color: white;
            background: var(--leg-color, #005eb8); font-weight: 700; }
        .leg-route strong, .leg-route span { display: block; }
        .leg-route span, .leg-time { color: #667085; font-size: 13px; }
        .leg-steps { border-top: 1px solid #e7ebef; padding: 8px 18px 18px; }
        .direction-step { display: grid; grid-template-columns: 38px 1fr;
            gap: 12px; padding: 14px 0; border-bottom: 1px solid #edf0f2; }
        .direction-step:last-child { border-bottom: 0; }
        .step-icon { width: 34px; height: 34px; display: grid;
            place-items: center; border-radius: 9px; background: #eaf3fb;
            color: var(--leg-color, #005eb8); font-weight: 800; font-size: 12px; }
        .step-icon svg { width: 21px; height: 21px; fill: currentColor; }
        .step-title { margin: 0 0 5px; font-weight: 700; }
        .step-detail { margin: 2px 0; color: #59636e; font-size: 13px; }
        .mode-badge { display: inline-block; margin-right: 5px; padding: 2px 7px;
            border-radius: 12px; background: #fff; color: var(--leg-color, #005eb8);
            border: 1px solid var(--leg-color, #005eb8);
            font-size: 11px; text-transform: uppercase; }
        .result-error { background: #fff3f3; color: #9b1c1c; border-radius: 12px;
            padding: 18px; }
        .issue-panel { background: #fff; border: 1px solid #d9e0e6;
            border-radius: 14px; padding: 16px; }
        .issue-panel summary { color: #005eb8; cursor: pointer; font-weight: 700; }
        .issue-panel textarea, .issue-panel input { box-sizing: border-box;
            width: 100%; margin-top: 10px; padding: 11px; border: 1px solid #cbd5df;
            border-radius: 8px; font: inherit; }
        .issue-panel textarea { min-height: 100px; resize: vertical; }
        .issue-submit { margin-top: 10px; padding: 10px 15px; border: 0;
            border-radius: 8px; background: #005eb8; color: #fff; font-weight: 700;
            cursor: pointer; }
        .issue-status { margin: 8px 0 0; font-size: 13px; }
        #journey-map { height: 390px; border-radius: 14px; background: #dfe8ef;
            margin-top: 18px; overflow: hidden; }
        .live-status { margin-top: 10px; font-size: 13px; color: #e8f3ff; }
        .vehicle-marker { width: 30px; height: 30px; border-radius: 50%;
            display: grid; place-items: center; background: #f7b500; color: #17202a;
            border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,.35);
            font-weight: 800; font-size: 11px; }
        .route-loading { margin: 12px 0 0; color: #334155; text-align: center;
            font-weight: 600; }
        .submit-button:disabled { cursor: wait; opacity: .7; }
        .endpoint-marker { width: 28px; height: 28px; border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg); display: grid; place-items: center;
            color: white; border: 2px solid white; box-shadow: 0 2px 7px rgba(0,0,0,.4);
            font-size: 12px; font-weight: 800; }
        .endpoint-marker span { transform: rotate(45deg); }
        .endpoint-origin { background: #16803c; }
        .endpoint-destination { background: #c62828; }
        .endpoint-waypoint { background: #7b2cbf; }
        @media (max-width: 560px) {
            .leg-result summary { grid-template-columns: 38px 1fr; }
            .leg-time { grid-column: 2; }
        }

        /* Responsive presentation inspired by the approved visual reference. */
        :root { --blue: #0055a6; --orange: #ef6c00; --ink: #10233f;
            --muted: #5e718d; --line: #c9d8e8; --pale: #edf5fc; }
        body { background: #fff; color: var(--ink); }
        .site-header { min-height: 54px; border-bottom: 1px solid var(--line);
            background: #fff; display: flex; align-items: center; }
        .site-header-inner { width: min(850px, calc(100% - 32px)); margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--blue);
            font-size: 17px; font-weight: 800; text-decoration: none; }
        .brand-mark { width: 27px; height: 27px; border: 2px solid var(--blue);
            border-radius: 4px; display: grid; place-items: center; font-size: 15px; }
        .site-tagline { color: var(--muted); font-size: 12px; }
        .page { width: min(850px, calc(100% - 32px)); margin: 36px auto 54px; }
        .header, .route-form { width: min(560px, 100%); margin-left: auto; margin-right: auto; }
        .header { border-left: 3px solid var(--orange); padding-left: 14px; margin-bottom: 22px; }
        .header h1 { color: var(--blue); font-size: clamp(26px, 4vw, 34px); letter-spacing: -.02em; }
        .header p { color: var(--muted); }
        .route-form { padding: 0; border: 0; border-radius: 0; box-shadow: none; }
        .stop-card { padding: 0 0 17px; margin: 0 0 17px; border: 0;
            border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; }
        .stop-card:hover { border-color: var(--line); }
        .stop-header { margin: 0; }
        .stop-number { display: none; }
        .remove-stop { width: 38px; height: 38px; position: absolute; right: 5px;
            top: 25px; z-index: 2; background: #f5f8fb; }
        .stop-label, .time-label { color: var(--ink); font-size: 13px; font-weight: 750; }
        .stop-input, .time-input, #travel-date { min-height: 46px; border-radius: 3px;
            border: 1px solid #9fb9d5; color: var(--ink); background: #fff; font-size: 16px; }
        #extra-stops .stop-input { padding-right: 48px; }
        .time-section { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 14px; }
        .time-section .time-label { grid-column: 2; grid-row: 1; }
        .time-section .time-input { grid-column: 2; grid-row: 2; }
        .time-section > label[for="travel-date"] { grid-column: 1; grid-row: 1;
            font-size: 13px; font-weight: 750; }
        #travel-date { grid-column: 1; grid-row: 2; width: 100%; padding: 0 12px; }
        .time-hint { grid-column: 1 / -1; }
        #extra-stops .time-section { display: block; }
        .button-row { align-items: center; margin-top: 18px; }
        .add-stop, .submit-button { border-radius: 3px; }
        .add-stop { color: var(--blue); border: 1px solid #9fb9d5; background: #fff; }
        .add-stop:hover { background: var(--pale); }
        .submit-button { flex: 0 0 auto; background: var(--blue); padding: 0 22px; }
        .results-screen { gap: 20px; }
        .back-button { padding: 4px 0; height: auto; border-radius: 0; box-shadow: none;
            color: var(--blue); background: transparent; }
        .journey-summary { padding: 0 0 20px; color: var(--ink); background: transparent;
            border-radius: 0; border-bottom: 1px solid var(--line); }
        .journey-kicker { margin: 0 0 6px !important; color: var(--orange) !important;
            font-size: 12px; font-weight: 700; }
        .journey-heading { display: flex; justify-content: space-between; align-items: end;
            gap: 20px; }
        .journey-summary h2 { color: var(--blue); font-size: clamp(23px, 4vw, 31px); }
        .journey-summary p { color: var(--muted); }
        .journey-clock { color: var(--ink); font-size: 22px; font-weight: 800; white-space: nowrap; }
        .journey-clock small { color: var(--muted); font-size: 12px; font-weight: 500; }
        .journey-layout { display: grid; grid-template-columns: minmax(0, .9fr) minmax(340px, 1.1fr);
            gap: 22px; align-items: start; }
        .journey-directions h3 { margin: 0 0 12px; font-size: 16px; }
        .leg-result { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
        .leg-result summary { padding: 13px 2px; grid-template-columns: 32px 1fr auto; gap: 10px; }
        .leg-number { width: 29px; height: 29px; font-size: 12px; }
        .leg-steps { padding: 0 8px 8px 44px; border: 0; }
        .direction-step { padding: 11px 0; }
        .mode-badge { display: none; }
        .step-title { color: var(--ink); }
        .map-panel { min-width: 0; }
        #journey-map { height: 390px; margin: 0; border-radius: 3px; border: 1px solid #9fb9d5; }
        .live-status { color: var(--muted); }
        .issue-panel { width: fit-content; border-radius: 3px; padding: 12px 15px; }
        @media (max-width: 720px) {
            .page { width: min(560px, calc(100% - 24px)); margin-top: 24px; }
            .site-header-inner { width: calc(100% - 24px); }
            .site-tagline { display: none; }
            .journey-heading { display: block; }
            .journey-clock { margin-top: 13px; font-size: 20px; }
            .journey-layout { grid-template-columns: 1fr; }
            .map-panel { grid-row: 1; }
            #journey-map { height: min(55vh, 360px); }
            .journey-directions { grid-row: 2; }
            .issue-panel { width: 100%; }
        }
        @media (max-width: 480px) {
            .page { width: calc(100% - 20px); margin-top: 18px; }
            .header h1 { font-size: 27px; }
            .time-section { grid-template-columns: 1fr; }
            .time-section .time-label, .time-section .time-input,
            .time-section > label[for="travel-date"], #travel-date,
            .time-hint { grid-column: 1; grid-row: auto; }
            .button-row { flex-direction: column; }
            .add-stop, .submit-button { width: 100%; min-height: 48px; }
            .leg-result summary { grid-template-columns: 32px 1fr; }
            .leg-time { grid-column: 2; }
            .leg-steps { padding-left: 8px; }
            button, input, textarea { font-size: 16px; }
        }
    </style>

</head>


<body>

<header class="site-header">
    <div class="site-header-inner">
        <a class="brand" href="/" aria-label="Easitransit home">
            <span class="brand-mark">e</span>
            <span>easitransit</span>
        </a>
        <span class="site-tagline">Edmonton journey planner</span>
    </div>
</header>


<div class="page">


    <!-- =================================
         HEADER
    ================================== -->

    <div class="header">

        <h1>Plan your journey</h1>

        <p>
            Find a practical route by bus or LRT in Edmonton.
        </p>

    </div>

    <!-- =================================
         ROUTE FORM
    ================================== -->

    <form id="route-form" class="route-form">
        <!-- =================================
             STOP 1
        ================================== -->

        <div class="stop-card">
            <div class="stop-header">
                <span class="stop-number">
                    Stop 1
                </span>
            </div>
            <label
                class="stop-label"
                for="stop1"
            >
                Departure stop
            </label>


            <div class="input-group">


                <input
                    type="search"
                    id="stop1"
                    name="stop1"
                    class="stop-input"
                    placeholder="Search for a stop..."
                    autocomplete="off"
                    required
                >


                <div class="suggestions"></div>


            </div>



            <div class="time-section">
                <label
                    class="time-label"
                    for="time1"
                >
                    Departure time
                </label>
                <input
                    type="time"
                    id="time1"
                    name="time1"
                    class="time-input stop-departure-time"
                    step="60"
                >
                <label for="travel-date">Travel date:</label>

<input
    type="date"
    id="travel-date"
    name="travel-date"
/>

                <div class="time-hint">

                    Leave blank to depart now.

                </div>
            </div>
        </div>

        <!-- =================================
             EXTRA STOPS
        ================================== -->

        <div id="extra-stops"></div>
        <label style="display:flex;align-items:center;gap:8px;margin:14px 0;">
            <input type="checkbox" id="buses-only">
            Buses only (exclude LRT)
        </label>
        <!-- =================================
             BUTTONS
        ================================== -->

        <div class="button-row">
            <button
                type="button"
                class="add-stop"
                onclick="addStop()"
            >
                + Add Stop
            </button>


            <input
                type="submit"
                class="submit-button"
                value="Search Routes"
            >


        </div>
        <p id="route-loading" class="route-loading" hidden aria-live="polite">
            Finding the best journey… This may take a moment.
        </p>


    </form>

    <section id="results-screen" class="results-screen" hidden
        aria-live="polite">
        <div class="results-top">
            <button type="button" id="back-to-search" class="back-button">
                &lt; Edit journey
            </button>
        </div>
        <div id="results-content"></div>
        <details class="issue-panel">
            <summary>Report an issue with this journey</summary>
            <form id="issue-form">
                <textarea id="issue-description" maxlength="2000" required
                    placeholder="Tell us what went wrong (at least 10 characters)."></textarea>
                <button class="issue-submit" type="submit">Send report</button>
                <p id="issue-status" class="issue-status" aria-live="polite"></p>
            </form>
        </details>
    </section>


</div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ==================================================
   STOP COUNT
================================================== */
let stop_count = 1;
/* ==================================================
   ADD STOP
================================================== */

function addStop() {

    stop_count++;

    if (stop_count > 4) {
        alert("Limit of 4 stops");
        stop_count--;
        return;
    }

    const wrapper = document.createElement("div");

    wrapper.className = "stop-card";

    wrapper.innerHTML = `
        <div class="stop-header">

            <span class="stop-number">
                Stop ${stop_count}
            </span>

            <button
                type="button"
                class="remove-stop"
                aria-label="Remove stop"
            >
                −
            </button>

        </div>

        <label class="stop-label">
            Next stop
        </label>

        <div class="input-group">

            <input
                type="search"
                name="stop_n[]"
                class="stop-input"
                placeholder="Search for a stop..."
                autocomplete="off"
                required
            >

            <div class="suggestions"></div>

        </div>

        <div class="time-section">
            <label class="time-label">Leave this stop at (optional)</label>
            <input type="time" class="time-input stop-departure-time" step="60">
            <div class="time-hint">
                Leave blank to continue when you arrive. Ignored for the final stop.
            </div>
        </div>
    `;


    document
        .querySelector("#extra-stops")
        .appendChild(wrapper);
    /* Remove this specific stop */
    wrapper
        .querySelector(".remove-stop")
        .addEventListener("click", () => {
            wrapper.remove();
             stop_count =
            document.querySelectorAll(".stop-card").length;
            renumberStops();
        });
    /* Give the new input autocomplete */
    attachStopBehavior(
        wrapper.querySelector(".stop-input")
    );

}
/*renumbers stops when stops are removed*/
function renumberStops() {

    const stopCards =
        document.querySelectorAll(".stop-card");

    stopCards.forEach((card, index) => {

        const number =
            card.querySelector(".stop-number");

        number.textContent =
            `Stop ${index + 1}`;

    });

}


const stopDetailsById = new Map();
/* ==================================================
   STOP SEARCH + VALIDATION
================================================== */

function attachStopBehavior(input) {


    /*
     * The suggestions div is immediately
     * after the input.
     */
    const suggestions = input.nextElementSibling; //suggestions represents the suggestion box belonging to the input the user just clicked
    /* ==============================================
       LIVE SEARCH
    ============================================== */

    let searchTimer = null;
    input.addEventListener(
        "input",() => {const query = input.value.trim();
            /* Nothing typed */
            if (query === "") {
                suggestions.innerHTML = "";
                input.setCustomValidity("");
                return;
            }
            clearTimeout(searchTimer);
            if (query.length < 2) return;
            searchTimer = setTimeout(async () => {
                try {
                    const response = await fetch(
                        `/api/stops/search?q=${encodeURIComponent(query)}`
                    );
                    const data = await response.json();
                    if (input.value.trim() !== query) return;
                    suggestions.innerHTML = (data.stops || [])
                        .map(stop => `<div class="suggestion">${escapeHtml(stop)}</div>`)
                        .join("");
                } catch {
                    suggestions.innerHTML = "";
                }
            }, 180);

        }
    );
/*so that suggestions list closes when another box is clicked
box = Stop 1's suggestions
box = Stop 2's suggestions
box = Stop 3's suggestions
box = Stop 4's suggestions
suggestions = suggestion box belonging to the input the user clicked */
    input.addEventListener("focus", () => { //method that triggers when a box recieves focus
    document.querySelectorAll(".suggestions").forEach(box => {
        if (box !== suggestions) {
            box.innerHTML = ""; //empty suggestion box
        }

    });
});

    /* ==============================================
       CLICK SUGGESTION
    ============================================== */

    /*
     * Listener is attached to the suggestions
     * container instead of individual suggestions.
     */

    suggestions.addEventListener(
        "mousedown",
        event => {
            const suggestion =
                event.target.closest(
                    ".suggestion"
                );
            if (!suggestion) {
                return;
            }
            /* Put selected stop into input */
            input.value =
                suggestion.textContent.trim();
            /* Hide suggestions */
            suggestions.innerHTML = "";
            /* Selected stop is valid */

            input.setCustomValidity("");

        }
    );
}
/* ==================================================
   INITIAL STOP INPUTS
================================================== */

document
    .querySelectorAll(".stop-input")
    .forEach(attachStopBehavior);
addStop(); /*Automatically loads stop 2 when page loads*/
/* =================================================
   FORM SUBMISSION
================================================== */
const form =
    document.getElementById("route-form");
let journeyMap = null;
let realtimeTimer = null;
let vehicleMarkers = new Map();
let lastJourneyContext = null;
form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const submitButton = form.querySelector(".submit-button");
    const loading = document.getElementById("route-loading");
    submitButton.disabled = true;
    submitButton.value = "Searching…";
    loading.hidden = false;
    try {
     //console.log("🚨 FORM SUBMITTED");
    const departureTime = document.getElementById("time1");
    /*
     * If the user didn't select a time,
     * automatically use the current local time.
     */
    if (departureTime.value === "") {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        departureTime.value = `${hours}:${minutes}`;
    }
    const travelDateInput = //gets the date
    document.getElementById("travel-date");
    /*if leftblank use todays date*/
    let travelDate =
    travelDateInput.value;

if (travelDate === "") {

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            today.getDate()
        ).padStart(2, "0");

    travelDate =
        `${year}-${month}-${day}`;
}

   const gtfsTravelDate =
    travelDate.replaceAll("-", "");

const localDeparture =
    new Date(
        `${travelDate}T${departureTime.value}:00`
    );

const departureDateTime =
    localDeparture.toISOString();


/* Collect all user inputs */
const stopCards = document.querySelectorAll(".stop-card");
const stops = Array.from(stopCards).map(card => ({
    name: card.querySelector(".stop-input").value.trim()
}));
const preferredDepartureTimes = Array.from(stopCards).map(card =>
    card.querySelector(".stop-departure-time")?.value || null
);


/* Send data to backend */
const response =
    await fetch(
        "/api/route",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                stops,

                departureTime:
                    departureTime.value,

                preferredDepartureTimes,

                travelDate:
                    gtfsTravelDate,

                departureDateTime:
                    departureDateTime,

                busesOnly:
                    document.getElementById("buses-only").checked
            })
        }
    );

const data =
    await response.json();

lastJourneyContext = {
    stops: stops.map(stop => stop.name),
    departureTime: departureTime.value,
    preferredDepartureTimes,
    travelDate: gtfsTravelDate,
    busesOnly: document.getElementById("buses-only").checked,
    success: Boolean(data.success && data.multiStopTrip?.success),
    failedLeg: data.multiStopTrip?.failedLeg || null,
    failureReason: data.multiStopTrip?.reason || data.error || null
};

console.log(
    "Backend response:",
    data
);

if (data.success && data.multiStopTrip?.success) {
    await loadJourneyStopDetails(data.multiStopTrip);
}
renderJourneyResults(data);
    } catch (error) {
        renderJourneyResults({
            success: false,
            error: "We could not contact the route service. Check your connection and try again."
        });
    } finally {
        submitButton.disabled = false;
        submitButton.value = "Search Routes";
        loading.hidden = true;
    }
});

async function loadJourneyStopDetails(journey) {
    const ids = new Set();
    for (const leg of journey.legs || []) {
        for (const action of leg.itinerary?.itinerary || []) {
            if (action.fromStopId != null) ids.add(String(action.fromStopId));
            if (action.toStopId != null) ids.add(String(action.toStopId));
        }
    }
    if (!ids.size) return;
    try {
        const response = await fetch(
            `/api/stops/details?ids=${encodeURIComponent([...ids].join(","))}`
        );
        const data = await response.json();
        for (const stop of data.stops || []) {
            stopDetailsById.set(String(stop.stopId), stop);
        }
    } catch {
        /* Stop IDs remain usable labels when optional display details fail. */
    }
}

document.getElementById("issue-form").addEventListener("submit", async event => {
    event.preventDefault();
    const issueForm = event.currentTarget;
    const status = document.getElementById("issue-status");
    const button = issueForm.querySelector("button");
    button.disabled = true;
    status.textContent = "Sending…";
    try {
        const response = await fetch("/api/issues", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                category: "routing",
                description: document.getElementById("issue-description").value,
                journeyContext: lastJourneyContext
            })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not send report.");
        issueForm.reset();
        status.textContent = "Thank you—your report was received.";
    } catch (error) {
        status.textContent = error.message;
    } finally {
        button.disabled = false;
    }
});

document.getElementById("back-to-search").addEventListener("click", () => {
    document.getElementById("results-screen").hidden = true;
    form.hidden = false;
    document.querySelector(".header").hidden = false;
    clearInterval(realtimeTimer);
    document.querySelector(".header p").textContent =
        "Choose your stops and find the best route.";
    window.scrollTo({ top: 0, behavior: "smooth" });
});

function renderJourneyResults(data) {
    const screen = document.getElementById("results-screen");
    const content = document.getElementById("results-content");
    const journey = data.multiStopTrip;

    form.hidden = true;
    document.querySelector(".header").hidden = true;
    screen.hidden = false;
    document.querySelector(".header p").textContent =
        "Your complete ETS journey.";

    if (!data.success || !journey?.success) {
        const failed = journey?.failedLeg
            ? ` Leg ${journey.failedLeg} could not be planned.`
            : "";
        const message = data.error ||
            journey?.failureReason ||
            "No complete route was found for those locations and time.";
        content.innerHTML = `<div class="result-error"><strong>We couldn’t plan this journey.</strong><br>${escapeHtml(message)}${failed}</div>`;
        return;
    }

    const first = journey.legs[0];
    const last = journey.legs[journey.legs.length - 1];
    const durationMinutes = journeyDurationMinutes(
        first.actualDepartureTime,
        journey.finalArrivalTime
    );
    content.innerHTML = `
        <div class="journey-summary">
            <p class="journey-kicker">Recommended journey</p>
            <div class="journey-heading">
                <div>
                    <h2>${escapeHtml(first.origin)} to ${escapeHtml(last.destination)}</h2>
                    <p>${journey.legs.length} ${journey.legs.length === 1 ? "journey leg" : "journey legs"}</p>
                </div>
                <div class="journey-clock">
                    ${formatTime(first.actualDepartureTime)} to ${formatTime(journey.finalArrivalTime)}
                    ${durationMinutes ? `<small>${durationMinutes} min</small>` : ""}
                </div>
            </div>
            ${data.scheduleBasis?.exact === false
                ? `<p>Schedule estimate: ${escapeHtml(data.scheduleBasis.dayType)} service</p>`
                : ""}
        </div>
        <div class="journey-layout">
            <div class="journey-directions">
                <h3>Journey details</h3>
                ${journey.legs.map((leg, index) => renderLeg(leg, index)).join("")}
            </div>
            <div class="map-panel">
                <div id="journey-map" aria-label="Journey map"></div>
                <p id="live-status" class="live-status">Loading map…</p>
            </div>
        </div>
    `;
    renderJourneyMap(journey);
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderLeg(leg, index) {
    const actions = leg.itinerary?.itinerary || [];
    const legColour = LEG_COLOURS[index % LEG_COLOURS.length];
    return `
        <details class="leg-result" style="--leg-color:${legColour}" ${index === 0 ? "open" : ""}>
            <summary>
                <span class="leg-number">${leg.legNumber}</span>
                <span class="leg-route">
                    <strong>${escapeHtml(leg.origin)} → ${escapeHtml(leg.destination)}</strong>
                    <span>${actions.filter(a => a.type === "transit").length} transit rides</span>
                </span>
                <span class="leg-time">${formatTime(leg.actualDepartureTime)} – ${formatTime(leg.arrivalTime)}</span>
            </summary>
            <div class="leg-steps">
                ${actions.map((action, i) => renderDirection(action, leg, i)).join("")}
            </div>
        </details>`;
}

function renderDirection(action, leg, index) {
    const from = endpointName(action, "from", leg);
    const to = endpointName(action, "to", leg);
    if (action.type === "walk") {
        const minutes = action.durationMinutes ??
            (Number.isFinite(action.durationSeconds)
                ? Math.ceil(action.durationSeconds / 60) : null);
        const distance = Number.isFinite(action.distanceMetres)
            ? `${Math.round(action.distanceMetres)} m` : null;
        return stepHtml("Walk", directionIcon("walk"), from, to,
            [minutes !== null ? `${minutes} min walk` : "Walking time unavailable", distance]
                .filter(Boolean).join(" · "));
    }
    const mode = action.transitMode ||
        (String(action.routeType) === "0" ? "train" : "bus");
    const title = `${mode === "train" ? "Train" : "Bus"} ${escapeHtml(action.routeId || "")}`;
    const detail = `${formatTime(action.departureTime)} – ${formatTime(action.arrivalTime)}` +
        (action.headsign ? ` · toward ${escapeHtml(action.headsign)}` : "");
    return stepHtml(title, directionIcon(mode), from, to, detail, mode);
}

function directionIcon(mode) {
    if (mode === "train") {
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3l2 3h-3l-1.3-2H9.3L8 21H5l2-3a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3Zm0 3v6h10V5H7Zm1 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>`;
    }
    if (mode === "bus") {
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12a3 3 0 0 1 3 3v11a2 2 0 0 1-2 2v3h-3v-2H8v2H5v-3a2 2 0 0 1-2-2V5a3 3 0 0 1 3-3Zm0 3v6h12V5H6Zm1 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>`;
    }
    return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 5.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0ZM10 9h3l2 5h4v2h-5.4l-1.1-2.5L11 17l3 4h-3l-3-4 2-5-2 1.5V17H6v-4.5L10 9Z"/></svg>`;
}

function stepHtml(title, icon, from, to, detail, mode = "walk") {
    return `<div class="direction-step">
        <span class="step-icon">${icon}</span>
        <div><p class="step-title"><span class="mode-badge">${mode}</span>${title}</p>
        <p class="step-detail">${escapeHtml(from)} → ${escapeHtml(to)}</p>
        <p class="step-detail">${detail}</p></div></div>`;
}

function endpointName(action, side, leg) {
    const stopId = action[`${side}StopId`];
    if (stopId !== null && stopId !== undefined) {
        return stopDetailsById.get(String(stopId))?.name || String(stopId);
    }
    return action[`${side}Name`] || (side === "from" ? leg.origin : leg.destination);
}

function formatTime(value) {
    if (!value) return "—";
    const [rawHour, minute] = String(value).split(":").map(Number);
    const hour = rawHour % 24;
    const suffix = hour >= 12 ? "PM" : "AM";
    return `${hour % 12 || 12}:${String(minute).padStart(2, "0")} ${suffix}`;
}

function journeyDurationMinutes(departure, arrival) {
    if (!departure || !arrival) return 0;
    const toMinutes = value => {
        const [hours, minutes] = String(value).split(":").map(Number);
        return hours * 60 + minutes;
    };
    return Math.max(0, toMinutes(arrival) - toMinutes(departure));
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        "'": "&#39;", '"': "&quot;"
    })[character]);
}

const LEG_COLOURS = ["#005eb8", "#7b2cbf", "#d1495b"];

async function renderJourneyMap(journey) {
    const status = document.getElementById("live-status");
    if (!window.L) {
        status.textContent = "The map library could not be loaded.";
        return;
    }
    if (journeyMap) journeyMap.remove();
    clearInterval(realtimeTimer);
    vehicleMarkers = new Map();
    journeyMap = L.map("journey-map", { zoomControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors"
    }).addTo(journeyMap);

    const allBounds = [];
    const legLayers = [];
    const shapeRequests = [];
    journey.legs.forEach((leg, legIndex) => {
        const group = L.featureGroup().addTo(journeyMap);
        legLayers.push(group);
        const colour = LEG_COLOURS[legIndex % LEG_COLOURS.length];
        for (const action of leg.itinerary?.itinerary || []) {
            const from = mapPoint(action, "from");
            const to = mapPoint(action, "to");
            if (!from || !to) continue;
            const fallbackPoints = [from, to];
            const points = action.type === "walk" && action.encodedPolyline
                ? decodeGooglePolyline(action.encodedPolyline)
                : fallbackPoints;
            const drawLine = linePoints => L.polyline(linePoints, {
                color: action.type === "walk" ? "#59636e" : colour,
                weight: action.type === "walk" ? 4 : 6,
                dashArray: action.type === "walk" ? "7 7" : null,
                opacity: .9
            }).addTo(group);
            if (action.type === "transit" && action.tripId &&
                action.fromStopId != null && action.toStopId != null) {
                shapeRequests.push(loadTransitShape(action).then(shapePoints => {
                    const linePoints = shapePoints.length >= 2 ? shapePoints : fallbackPoints;
                    const line = drawLine(linePoints);
                    line.bindPopup(`${action.transitMode === "train" ? "Train" : "Bus"} ${escapeHtml(action.routeId)}`);
                    allBounds.push(...linePoints);
                }));
                continue;
            }
            const line = drawLine(points);
            line.bindPopup(action.type === "walk"
                ? `${action.durationMinutes || Math.ceil(action.durationSeconds / 60)} min walk`
                : `${action.transitMode === "train" ? "Train" : "Bus"} ${escapeHtml(action.routeId)}`);
            allBounds.push(...points);
        }
    });

    const firstActions = journey.legs[0]?.itinerary?.itinerary || [];
    const firstPoint = firstActions.length
        ? mapPoint(firstActions[0], "from")
        : null;
    if (firstPoint) {
        addEndpointMarker(firstPoint, "Origin", "origin", "O");
        allBounds.push(firstPoint);
    }

    journey.legs.forEach((leg, index) => {
        const actions = leg.itinerary?.itinerary || [];
        if (!actions.length) return;
        const point = mapPoint(actions.at(-1), "to");
        if (!point) return;
        const isFinal = index === journey.legs.length - 1;
        addEndpointMarker(
            point,
            isFinal ? "Final destination" : `Destination ${index + 1}`,
            isFinal ? "destination" : "waypoint",
            isFinal ? "D" : String(index + 1)
        );
        allBounds.push(point);
    });

    await Promise.all(shapeRequests);

    if (allBounds.length) journeyMap.fitBounds(allBounds, { padding: [28, 28] });
    else journeyMap.setView([53.5461, -113.4938], 11);

    document.querySelectorAll(".leg-result").forEach((details, index) => {
        details.addEventListener("toggle", () => {
            if (details.open) {
                const bounds = legLayers[index]?.getBounds();
                if (bounds?.isValid()) journeyMap.fitBounds(bounds, { padding: [35, 35] });
            }
        });
    });

    const tripIds = journey.legs.flatMap(leg =>
        (leg.itinerary?.itinerary || [])
            .filter(action => action.type === "transit" && action.tripId)
            .map(action => action.tripId)
    );
    const today = new Date();
    const todayKey = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, "0")}${String(today.getDate()).padStart(2, "0")}`;
    if (journey.travelDate !== todayKey) {
        status.textContent = "Scheduled journey — live vehicles are shown for today’s trips.";
        return;
    }
    updateLiveVehicles(tripIds);
    realtimeTimer = setInterval(() => updateLiveVehicles(tripIds), 15000);
}

function addEndpointMarker(point, label, type, symbol) {
    const icon = L.divIcon({
        className: "",
        html: `<div class="endpoint-marker endpoint-${type}"><span>${symbol}</span></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
        popupAnchor: [0, -28]
    });
    L.marker(point, { icon }).addTo(journeyMap).bindPopup(escapeHtml(label));
}

async function loadTransitShape(action) {
    try {
        const tripId = encodeURIComponent(action.tripId);
        const fromStopId = encodeURIComponent(action.fromStopId);
        const toStopId = encodeURIComponent(action.toStopId);
        const response = await fetch(`/api/trips/${tripId}/shape?fromStopId=${fromStopId}&toStopId=${toStopId}`);
        if (!response.ok) return [];
        const data = await response.json();
        return data.success
            ? data.points.map(point => [Number(point.lat), Number(point.lon)])
            : [];
    } catch {
        return [];
    }
}

async function updateLiveVehicles(tripIds) {
    const status = document.getElementById("live-status");
    try {
        const response = await fetch(`/api/realtime/vehicles?tripIds=${encodeURIComponent(tripIds.join(","))}`);
        const data = await response.json();
        if (!data.success) throw new Error(data.error);
        const activeIds = new Set();
        data.vehicles.forEach(vehicle => {
            activeIds.add(vehicle.vehicleId);
            let marker = vehicleMarkers.get(vehicle.vehicleId);
            if (!marker) {
                marker = L.marker([vehicle.latitude, vehicle.longitude], {
                    icon: L.divIcon({ className: "", html: `<div class="vehicle-marker">${escapeHtml(vehicle.routeId || "ETS")}</div>`, iconSize: [30, 30] })
                }).addTo(journeyMap).bindPopup(`Live vehicle ${escapeHtml(vehicle.label || vehicle.vehicleId)}`);
                vehicleMarkers.set(vehicle.vehicleId, marker);
            } else marker.setLatLng([vehicle.latitude, vehicle.longitude]);
        });
        for (const [id, marker] of vehicleMarkers) {
            if (!activeIds.has(id)) { journeyMap.removeLayer(marker); vehicleMarkers.delete(id); }
        }
        status.textContent = data.vehicles.length
            ? `${data.vehicles.length} matching live ${data.vehicles.length === 1 ? "vehicle" : "vehicles"} · updates every 15 seconds`
            : "No matching vehicle is currently reporting; scheduled route shown.";
    } catch {
        status.textContent = "Live vehicles temporarily unavailable; scheduled route shown.";
    }
}

function mapPoint(action, side) {
    const location = action[`${side}Location`];
    if (location) return [Number(location.lat), Number(location.lon)];
    const stop = stopDetailsById.get(String(action[`${side}StopId`]));
    return stop ? [Number(stop.lat), Number(stop.lon)] : null;
}

function decodeGooglePolyline(encoded) {
    let index = 0, latitude = 0, longitude = 0;
    const points = [];
    while (index < encoded.length) {
        let result = 0, shift = 0, byte;
        do { byte = encoded.charCodeAt(index++) - 63; result |= (byte & 31) << shift; shift += 5; } while (byte >= 32);
        latitude += result & 1 ? ~(result >> 1) : result >> 1;
        result = 0; shift = 0;
        do { byte = encoded.charCodeAt(index++) - 63; result |= (byte & 31) << shift; shift += 5; } while (byte >= 32);
        longitude += result & 1 ? ~(result >> 1) : result >> 1;
        points.push([latitude / 1e5, longitude / 1e5]);
    }
    return points;
}
